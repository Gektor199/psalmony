services:
  psalmony:
    build: .
    ports:
      - "127.0.0.1:3180:3180"
    environment:
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATABASE_URL: postgres://psalmony:${POSTGRES_PASSWORD:-psalmony-local}@postgres:5432/psalmony
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - psalmony-data:/app/data
    restart: unless-stopped
    init: true
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: psalmony
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psalmony-local}
      POSTGRES_DB: psalmony
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - psalmony-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psalmony -d psalmony"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  psalmony-data:
  psalmony-postgres:
