[package]
name = "psalmony-desktop"
version = "0.6.1"
edition = "2021"
[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
rtrb = "0.3"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
tiny_http = "0.12"
include_dir = "0.7"
reqwest = { version = "=0.13.2", default-features = false, features = ["blocking", "native-tls"] }
tauri-plugin-opener = "=2.7.0"
