name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # API suites require a running test server; local release QA runs those
      # separately with TEST_BASE, IDENTITY_TEST_BASE and its matching DB URL.
      - run: npm test
      - name: Check shell syntax
        run: bash -n scripts/backup.sh scripts/restore-check.sh scripts/backup-common.sh scripts/backup-smoke.sh
      - name: Build application
        run: docker build --tag psalmony-backup-fixture .
      - name: Restore a populated backup and check failure paths
        run: bash scripts/backup-smoke.sh psalmony-backup-fixture
